apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgresql, namespace: datatest  # solo prueba }
spec:
  serviceName: postgresql
  replicas: 1
  selector: { matchLabels: { app: postgresql } }
  template:
    metadata: { labels: { app: postgresql } }
    spec:
      securityContext: { runAsUser: 70, runAsGroup: 70, fsGroup: 70, runAsNonRoot: true }
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.12-alpine
          env:
            - { name: POSTGRES_DB, value: storehub }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pg, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, postgres, -d, storehub] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: [pg_isready, -U, postgres] }, periodSeconds: 20, initialDelaySeconds: 30 }
          resources: { requests: { memory: 256Mi, cpu: 100m }, limits: { memory: 512Mi, cpu: 500m } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], storageClassName: local-path, resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgresql, namespace: datatest  # solo prueba }
spec: { selector: { app: postgresql }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: garage, namespace: datatest  # solo prueba }
spec:
  serviceName: garage
  replicas: 1
  selector: { matchLabels: { app: garage } }
  template:
    metadata: { labels: { app: garage } }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true }
      containers:
        - name: garage
          image: docker.io/dxflrs/garage:v2.5.0
          command: [/garage, server, --single-node, --default-bucket]
          envFrom: [{ secretRef: { name: garage } }]
          env: [{ name: GARAGE_CONFIG_FILE, value: /etc/garage/garage.toml }]
          ports: [{ containerPort: 3900, name: s3 }, { containerPort: 3903, name: admin }]
          readinessProbe: { tcpSocket: { port: 3900 }, periodSeconds: 5 }
          resources: { requests: { memory: 64Mi, cpu: 50m }, limits: { memory: 512Mi, cpu: 500m } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/garage, readOnly: true }
            - { name: meta, mountPath: /var/lib/garage/meta }
            - { name: data, mountPath: /var/lib/garage/data }
      volumes:
        - name: config
          secret: { secretName: garage, items: [{ key: garage.toml, path: garage.toml }] }
  volumeClaimTemplates:
    - metadata: { name: meta }
      spec: { accessModes: [ReadWriteOnce], storageClassName: local-path, resources: { requests: { storage: 1Gi } } }
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], storageClassName: local-path, resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: garage, namespace: datatest  # solo prueba }
spec: { selector: { app: garage }, ports: [{ port: 9000, targetPort: 3900, name: s3 }] }
